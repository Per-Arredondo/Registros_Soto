<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Pacientes - Dra. Karla Elisabeth Soto</title>
  <!-- CDNs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f0f4fb; }
    .container { padding: 2rem; }
    .form-control, .form-select { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4 animate__animated animate__fadeIn">Registro de Pacientes</h1>
    <!-- Formulario -->
    <form id="patientForm" class="row g-3">
      <div class="col-md-4">
        <label for="fechaRegistro" class="form-label">Fecha Registro</label>
        <input id="fechaRegistro" readonly class="form-control">
      </div>
      <div class="col-md-4">
        <label for="folio" class="form-label">Folio Único</label>
        <input id="folio" readonly class="form-control">
      </div>
      <div class="col-md-4">
        <label for="fechaProcedimiento" class="form-label">Fecha del Procedimiento</label>
        <input id="fechaProcedimiento" type="date" required class="form-control">
      </div>
      <div class="col-md-6">
        <label for="nombrePaciente" class="form-label">Nombre del Paciente</label>
        <input id="nombrePaciente" type="text" required class="form-control">
      </div>
      <div class="col-md-6">
        <label for="sexoPaciente" class="form-label">Sexo del Paciente</label>
        <select id="sexoPaciente" class="form-select" required>
          <option value="">Selección</option>
          <option>Mujer</option>
          <option>Hombre</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="especialidad" class="form-label">Procedimientos por Especialidad</label>
        <select id="especialidad" class="form-select" required>
          <option value="">Selección</option>
          <option>🩺 Cirugía General</option>
          <option>🤰 Ginecología y Obstetricia</option>
          <option>🔵 Urología</option>
          <option>🦴 Traumatología y Ortopedia</option>
          <option>📷 Endoscopía Digestiva</option>
          <option>👁️ Cirugía Plástica / Oftalmológica</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="procedimientoEspecifico" class="form-label">Procedimiento Específico</label>
        <select id="procedimientoEspecifico" class="form-select" required>
          <option value="">Selección</option>
          <!-- Lista completa de 42 procedimientos -->
          <option>Apendicectomía</option>
          <option>Colecistectomía laparoscópica</option>
          <option>Hemorroidectomía</option>
          <option>Hernioplastia</option>
          <option>Laparotomía exploradora</option>
          <option>Plastia Inguinal</option>
          <option>Plastia Umbilical</option>
          <option>AMEU (Aspiración Manual Endouterina)</option>
          <option>Cesárea</option>
          <option>Cerclaje cervical</option>
          <option>Colporrafia anterior y posterior</option>
          <option>Histerectomía</option>
          <option>Histeroscopía</option>
          <option>Legrado</option>
          <option>Miomectomía</option>
          <option>Salpingooforectomía</option>
          <option>Circuncisión</option>
          <option>Cistoscopía</option>
          <option>Colocación de catéter doble J</option>
          <option>Retiro de catéter doble J</option>
          <option>Litotripsia</option>
          <option>Nefrectomía</option>
          <option>Orquitectomía</option>
          <option>Prostatectomía radical</option>
          <option>Reimplante ureteral</option>
          <option>RTUP (Resección Transuretral de Próstata)</option>
          <option>Ureteroscopía</option>
          <option>Amputación</option>
          <option>Artroplastia total de cadera</option>
          <option>Artroplastia total de rodilla</option>
          <option>Artroscopía de rodilla o hombro</option>
          <option>Cirugía de ligamento cruzado anterior (LCA)</option>
          <option>Descompresión medular</option>
          <option>Fijación externa</option>
          <option>Infiltración articular</option>
          <option>Luxación de codo</option>
          <option>Osteosíntesis</option>
          <option>RAFI (Reducción abierta y fijación interna)</option>
          <option>Reconstrucción</option>
          <option>Tenorrafia o reparación de tendones</option>
          <option>Colonoscopia</option>
          <option>Blefaroplastia</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="tipoAnestesia" class="form-label">Tipo de Anestesia</label>
        <select id="tipoAnestesia" class="form-select" required>
          <option value="">Selección</option>
          <option>General</option>
          <option>Sedación</option>
          <option>Bloqueo</option>
          <option>Regional</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="clinica" class="form-label">Clínica</label>
        <select id="clinica" class="form-select" required>
          <option value="">Selección</option>
          <option>Angeles</option>
          <option>FEMEDI</option>
          <option>Innova</option>
          <option>La Salud Oftalmo</option>
          <option>Latino</option>
          <option>MasFertil</option>
          <option>Memorial</option>
          <option>Nahuatzen</option>
          <option>Notre Dame</option>
          <option>Nueva España</option>
          <option>Purandiro</option>
          <option>Renacimiento</option>
          <option>Star Medica</option>
          <option>Tacambaro</option>
          <option>Valladolid</option>
          <option>Victoria</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="tipoMedico" class="form-label">Tipo de Médico</label>
        <select id="tipoMedico" class="form-select" required>
          <option value="">Selección</option>
          <option>Anestesiólogo</option>
          <option>Quirúrgico</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="nombreMedico" class="form-label">Nombre del Dr. / Dra.</label>
        <select id="nombreMedico" class="form-select" required>
          <option value="">Selección</option>
          <option>Dr. Galindo</option>
          <option>Dr. García</option>
          <option>Dr. Sánchez</option>
          <option>Dr. Sergio García</option>
          <option>Dr. Valencia</option>
          <option>Dr. Villanueva</option>
          <option>Dr. Cervantes</option>
          <option>Dr. Ochoa</option>
          <option>Dra. Morales</option>
          <option>Dra. Padilla</option>
          <option>Dr. Chávez</option>
          <option>Dr. Muñoz</option>
          <option>Dr. Rangel</option>
          <option>Dr. Leyva</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="pagoRealizado" class="form-label">¿Pago Realizado?</label>
        <select id="pagoRealizado" class="form-select" required>
          <option value="">Selección</option>
          <option>Pagado</option>
          <option>Pendiente de Pago</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="formaPago" class="form-label">Forma de Pago</label>
        <select id="formaPago" class="form-select" required>
          <option value="">Selección</option>
          <option>Efectivo</option>
          <option>Transferencia</option>
          <option>Cheque</option>
          <option>Pendiente de Pago</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="cantidad" class="form-label">Cantidad (MXN)</label>
        <input id="cantidad" type="number" min="0" required class="form-control">
      </div>
      <div class="col-md-4">
        <label for="fechaPago" class="form-label">Fecha de Pago</label>
        <input id="fechaPago" type="date" class="form-control">
      </div>
      <div class="col-12">
        <label for="observaciones" class="form-label">Observaciones</label>
        <textarea id="observaciones" rows="3" class="form-control"></textarea>
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary">Guardar Registro</button>
      </div>
    </form>

    <!-- Tabla y filtro por Nombre Dr./Dra. -->
    <div class="mt-5">
      <h2>Registros</h2>
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="filterNombreMedicoTable" class="form-label">Filtrar por Dr./Dra.</label>
          <select id="filterNombreMedicoTable" class="form-select"><option value="">Todos</option></select>
        </div>
      </div>
      <table id="tableRegistros" class="table table-striped">
        <thead><tr><th>Folio</th><th>Paciente</th><th>Procedimiento</th><th>Cantidad</th><th>Dr./Dra.</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="text-end">
        <button id="exportPDF" class="btn btn-danger me-2">Exportar PDF</button>
        <button id="exportExcel" class="btn btn-success">Exportar Excel</button>
      </div>
    </div>
  </div>

  <script>
    const sheetURL = 'https://script.google.com/macros/s/AKfycbzscE08EHAgZkrJP7nWKGJyksH-OCUtaq9ouz1WTEJon-87bBoFN-PO6MLGtnPo-qpe4w/exec';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    const registros = [];
    document.addEventListener('DOMContentLoaded', () => {
      // Inicializar
      document.getElementById('fechaRegistro').value = dayjs().format('YYYY-MM-DD');
      document.getElementById('folio').value = 'F-' + dayjs().format('YYYYMMDDHHmmss');
      // Poblar filtro de doctores
      const medSel = document.getElementById('filterNombreMedicoTable');
      Array.from(document.getElementById('nombreMedico').options).forEach(o => {
        if (!o.value) return;
        medSel.append(new Option(o.text, o.value));
      });
      // Submit formulario
      document.getElementById('patientForm').addEventListener('submit', e => {
        e.preventDefault();
        const rec = {
          fecha: document.getElementById('fechaRegistro').value,
          folio: document.getElementById('folio').value,
          fechaProcedimiento: document.getElementById('fechaProcedimiento').value,
          nombrePaciente: document.getElementById('nombrePaciente').value,
          sexoPaciente: document.getElementById('sexoPaciente').value,
          especialidad: document.getElementById('especialidad').value,
          procedimiento: document.getElementById('procedimientoEspecifico').value,
          tipoSedacion: document.getElementById('tipoAnestesia').value,
          clinica: document.getElementById('clinica').value,
          tipoMedico: document.getElementById('tipoMedico').value,
          nombreDoctor: document.getElementById('nombreMedico').value,
          pagoRealizado: document.getElementById('pagoRealizado').value,
          formaPago: document.getElementById('formaPago').value,
          cantidad: document.getElementById('cantidad').value,
          fechaPago: document.getElementById('fechaPago').value,
          observaciones: document.getElementById('observaciones').value
        };
        fetch(sheetURL, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec) })
          .then(res => res.json())
          .then(() => Swal.fire('REGISTRO GUARDADO', '', 'success'))
          .catch(() => Swal.fire('Error al guardar', '', 'error'));
      });
      // Filtrar tabla
      document.getElementById('filterNombreMedicoTable').addEventListener('change', renderTable);
      // Exportaciones
      document.getElementById('exportPDF').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.autoTable({ head: [['Folio','Paciente','Procedimiento','Cantidad','Dr.']], body: getFiltered().map(r => [r.folio, r.nombrePaciente, r.procedimiento, r.cantidad, r.nombreDoctor]) });
        doc.save('registros.pdf');
      });
      document.getElementById('exportExcel').addEventListener('click', () => {
        const ws = XLSX.utils.json_to_sheet(getFiltered());
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Registros'); XLSX.writeFile(wb, 'registros.xlsx');
      });
      renderTable();
    });
    function getFiltered() { const f = document.getElementById('filterNombreMedicoTable').value; return registros.filter(r => !f || r.nombreDoctor === f); }
    function renderTable() {
      const tb = document.querySelector('#tableRegistros tbody'); tb.innerHTML = '';
      getFiltered().forEach(r => {
        tb.insertAdjacentHTML('beforeend', `<tr><td>${r.folio}</td><td>${r.nombrePaciente}</td><td>${r.procedimiento}</td><td>${r.cantidad}</td><td>${r.nombreDoctor}</td></tr>`);
      });
    }
  </script>
</body>
</html>
