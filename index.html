<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
// Código de envío a Google Sheets actualizado con campos coincidentes

// Función para generar folio único
function generarFolio() {
  return 'F-' + Date.now();
}

// Función para obtener fecha actual en formato MX
function obtenerFechaActual() {
  return new Date().toLocaleDateString('es-MX');
}

// Mostrar campos 'Otro'
function mostrarCampoOtro(selectId, inputId) {
  const selectEl = document.getElementById(selectId);
  const inputEl = document.getElementById(inputId);
  if (selectEl && inputEl) {
    selectEl.addEventListener('change', () => {
      inputEl.classList.toggle('hidden', selectEl.value !== 'Otro');
    });
  }
}

// Función para actualizar la tabla y gráficas
function actualizarTablaDashboard() {
  const filtro = document.getElementById('filtroAnestesiologo');
  const cuerpo = document.getElementById('tablaDashboard');
  if (!filtro || !cuerpo) return;
  cuerpo.innerHTML = '';

  const filtrados = filtro.value === 'Todos' ? registrosPacientes : registrosPacientes.filter(p => p.anestesiologo === filtro.value);
  filtrados.forEach(p => {
    const fila = document.createElement('tr');
    fila.innerHTML = `
      <td>${p.fecha}</td>
      <td>${p.nombrePaciente}</td>
      <td>${p.procedimiento}</td>
      <td>$${parseFloat(p.cantidad).toFixed(2)}</td>
      <td>${p.anestesiologo}</td>
    `;
    cuerpo.appendChild(fila);
  });
  actualizarGraficos(filtrados);
}

// Función para gráficos
function actualizarGraficos(data) {
  const pagado = data.filter(p => p.pagoRealizado === 'Pagado').length;
  const pendiente = data.filter(p => p.pagoRealizado === 'Pendiente de Pago').length;
  const ingresosPorMes = {};
  data.forEach(p => {
    if (p.pagoRealizado === 'Pagado') {
      const mes = new Date(p.fecha).toLocaleDateString('es-MX', { month: 'short', year: 'numeric' });
      ingresosPorMes[mes] = (ingresosPorMes[mes] || 0) + parseFloat(p.cantidad);
    }
  });
  const ctxPago = document.getElementById('graficoEstadoPago');
  const ctxIngreso = document.getElementById('graficoIngresos');
  if (ctxPago && ctxIngreso) {
    const pagoContext = ctxPago.getContext('2d');
    if (window.chartPago) window.chartPago.destroy();
    window.chartPago = new Chart(pagoContext, {
      type: 'bar',
      data: {
        labels: ['Pagado', 'Pendiente'],
        datasets: [{ label: 'Pacientes', data: [pagado, pendiente], backgroundColor: ['#28a745', '#ffc107'] }]
      }
    });
    const ingresoContext = ctxIngreso.getContext('2d');
    if (window.chartIngreso) window.chartIngreso.destroy();
    window.chartIngreso = new Chart(ingresoContext, {
      type: 'line',
      data: {
        labels: Object.keys(ingresosPorMes),
        datasets: [{ label: 'Ingresos (MXN)', data: Object.values(ingresosPorMes), borderColor: '#007bff', fill: false }]
      }
    });
  }
}

// Inicializar eventos
const registrosPacientes = [];
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fecha').value = obtenerFechaActual();
  document.getElementById('folio').value = generarFolio();
  mostrarCampoOtro('procedimiento', 'otroProcedimiento');
  mostrarCampoOtro('anestesiologo', 'otroAnestesio');
  mostrarCampoOtro('clinica', 'otraClinica');
  mostrarCampoOtro('cirujano', 'otroCirujano');
  mostrarCampoOtro('tipoSedacion', 'otroTipoSedacion');

  const pagoRealizadoEl = document.getElementById('pagoRealizado');
  if (pagoRealizadoEl) {
    pagoRealizadoEl.addEventListener('change', (e) => {
      const formaPago = document.getElementById('formaPago');
      const cantidad = document.getElementById('cantidad');
      const fechaPago = document.getElementById('fechaPago');
      if (e.target.value === 'Pendiente de Pago') {
        formaPago.value = 'Pendiente de Pago';
        formaPago.disabled = true;
        cantidad.value = 0;
        fechaPago.disabled = true;
      } else {
        formaPago.disabled = false;
        fechaPago.disabled = false;
      }
    });
  }

  document.getElementById('filtroAnestesiologo')?.addEventListener('change', actualizarTablaDashboard);

  const formEl = document.getElementById('patientForm');
  formEl?.addEventListener('submit', (e) => {
    e.preventDefault();
    const get = id => document.getElementById(id)?.value || '';
    const getOtro = (id, otroId) => get(id) === 'Otro' ? get(otroId) : get(id);

    const data = {
      fecha: get('fecha'),
      folio: get('folio'),
      fechaProcedimiento: get('fechaProcedimiento'),
      nombrePaciente: get('nombrePaciente'),
      sexoPaciente: get('sexoPaciente'),
      procedimiento: getOtro('procedimiento', 'otroProcedimiento'),
      tipoSedacion: getOtro('tipoSedacion', 'otroTipoSedacion'),
      anestesiologo: getOtro('anestesiologo', 'otroAnestesio'),
      clinica: getOtro('clinica', 'otraClinica'),
      cirujano: getOtro('cirujano', 'otroCirujano'),
      pagoRealizado: get('pagoRealizado'),
      formaPago: get('formaPago'),
      cantidad: get('cantidad'),
      fechaPago: get('fechaPago'),
      observaciones: get('observaciones')
    };

    enviarAGoogleSheets(data);
    registrosPacientes.push(data);
    actualizarTablaDashboard();
    alert('REGISTRO GUARDADO');
    formEl.reset();
    document.getElementById('fecha').value = obtenerFechaActual();
    document.getElementById('folio').value = generarFolio();
  });

  document.getElementById('btnExportarPDF')?.addEventListener('click', () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const folio = `FAC-${Date.now()}`;

    doc.setFontSize(16);
    doc.text("Dra. Karla Soto - Registro de Pacientes", 14, 20);
    doc.setFontSize(10);
    doc.text(`Folio: ${folio}`, 14, 28);
    doc.text(`Fecha: ${new Date().toLocaleDateString('es-MX')}`, 14, 34);

    const data = [...document.querySelectorAll('#tablaDashboard tr')].map(tr => [...tr.children].map(td => td.textContent));

    doc.autoTable({
      startY: 40,
      head: [['Fecha', 'Paciente', 'Procedimiento', 'Monto', 'Anestesiólogo']],
      body: data,
      styles: { halign: 'left' },
      theme: 'grid'
    });

    doc.save(`reporte_pacientes_${folio}.pdf`);
  });
});
const scriptURL = "https://script.google.com/macros/s/AKfycbwEfN8mdHr3UzV5Zu8DbBdBiNBg44rFQ06qPBSBcuYrp-BjioUxXDcjQL6Z0J7KRV2N9A/exec";

function enviarAGoogleSheets(data) {
  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify({
      fecha: data.fecha,
      folio: data.folio,
      fechaProcedimiento: data.fechaProcedimiento,
      nombrePaciente: data.nombrePaciente,
      sexoPaciente: data.sexoPaciente,
      especialidad: data.especialidad,
      procedimiento: data.procedimiento,
      tipoSedacion: data.tipoSedacion,
      tipoMedico: data.tipoMedico,
      nombreDoctor: data.nombreDoctor,
      clinica: data.clinica,
      cirujano: data.cirujano,
      pagoRealizado: data.pagoRealizado,
      formaPago: data.formaPago,
      cantidad: data.cantidad,
      fechaPago: data.fechaPago,
      observaciones: data.observaciones
    }),
    headers: {
      "Content-Type": "application/json"
    }
  })
    .then(response => response.json())
    .then(res => {
      if (res.status === "ok") {
        console.log("Registro guardado en Google Sheets");
      } else {
        console.error("Error al guardar en Sheets:", res.message);
      }
    })
    .catch(error => console.error("Fetch error:", error));
}
