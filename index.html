<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Pacientes - Dra. Karla Elisabeth Soto</title>
  <!-- CDNs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f0f4fb; }
    .container { padding: 2rem; }
    .form-control, .form-select { margin-bottom: 1rem; }
    #dashboard { margin-top: 3rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4 animate__animated animate__fadeIn">Registro de Pacientes</h1>
    <!-- Alerta de modo (HTTP vs file) -->
    <div id="modeAlert"></div>
    <!-- Formulario completo -->
    <form id="patientForm" class="row g-3">
      <div class="col-md-4"><label for="fechaRegistro" class="form-label">Fecha Registro</label><input id="fechaRegistro" readonly class="form-control"></div>
      <div class="col-md-4"><label for="folio" class="form-label">Folio Único</label><input id="folio" readonly class="form-control"></div>
      <div class="col-md-4"><label for="fechaProcedimiento" class="form-label">Fecha del Procedimiento</label><input id="fechaProcedimiento" type="date" required class="form-control"></div>
      <div class="col-md-6"><label for="nombrePaciente" class="form-label">Nombre del Paciente</label><input id="nombrePaciente" type="text" required class="form-control"></div>
      <div class="col-md-6"><label for="sexoPaciente" class="form-label">Sexo del Paciente</label><select id="sexoPaciente" class="form-select" required><option value="">Selección</option><option>Mujer</option><option>Hombre</option></select></div>
      <div class="col-md-6"><label for="especialidad" class="form-label">Procedimientos por Especialidad</label><select id="especialidad" class="form-select" required>
        <option value="">Selección</option>
        <option>🩺 Cirugía General</option>
        <option>🤰 Ginecología y Obstetricia</option>
        <option>🔵 Urología</option>
        <option>🦴 Traumatología y Ortopedia</option>
        <option>📷 Endoscopía Digestiva</option>
        <option>👁️ Cirugía Plástica / Oftalmológica</option>
      </select></div>
      <div class="col-md-6"><label for="procedimientoEspecifico" class="form-label">Procedimiento Específico</label><select id="procedimientoEspecifico" class="form-select" required>
        <option value="">Selección</option>
        <option>Apendicectomía</option>
        <option>Colecistectomía laparoscópica</option>
        <option>Hemorroidectomía</option>
        <option>Hernioplastia</option>
        <option>Laparotomía exploradora</option>
        <option>Plastia Inguinal</option>
        <option>Plastia Umbilical</option>
        <option>AMEU (Aspiración Manual Endouterina)</option>
        <option>Cesárea</option>
        <option>Cerclaje cervical</option>
        <option>Colporrafia anterior y posterior</option>
        <option>Histerectomía</option>
        <option>Histeroscopía</option>
        <option>Legrado</option>
        <option>Miomectomía</option>
        <option>Salpingooforectomía</option>
        <option>Circuncisión</option>
        <option>Cistoscopía</option>
        <option>Colocación de catéter doble J</option>
        <option>Retiro de catéter doble J</option>
        <option>Litotripsia</option>
        <option>Nefrectomía</option>
        <option>Orquiectomía</option>
        <option>Prostatectomía radical</option>
        <option>Reimplante ureteral</option>
        <option>RTUP (Resección Transuretral de Próstata)</option>
        <option>Ureteroscopía</option>
        <option>Amputación</option>
        <option>Artroplastia total de cadera</option>
        <option>Artroplastia total de rodilla</option>
        <option>Artroscopía de rodilla o hombro</option>
        <option>Cirugía de ligamento cruzado anterior (LCA)</option>
        <option>Descompresión medular</option>
        <option>Fijación externa</option>
        <option>Infiltración articular</option>
        <option>Luxación de codo</option>
        <option>Osteosíntesis</option>
        <option>RAFI (Reducción abierta y fijación interna)</option>
        <option>Reconstrucción</option>
        <option>Tenorrafia o reparación de tendones</option>
        <option>Colonoscopia</option>
        <option>Blefaroplastia</option>
      </select></div>
      <div class="col-md-4"><label for="tipoAnestesia" class="form-label">Tipo de Anestesia</label><select id="tipoAnestesia" class="form-select" required><option value="">Selección</option><option>General</option><option>Sedación</option><option>Bloqueo</option><option>Regional</option></select></div>
      <div class="col-md-4"><label for="tipoMedico" class="form-label">Tipo de Médico</label><select id="tipoMedico" class="form-select" required><option value="">Selección</option><option>Anestesiólogo</option><option>Quirúrgico</option></select></div>
      <div class="col-md-4"><label for="nombreMedico" class="form-label">Nombre del Dr. / Dra.</label><select id="nombreMedico" class="form-select" required>
        <option value="">Selección</option>
        <option>Dr. Galindo</option>
        <option>Dr. García</option>
        <option>Dr. Sánchez</option>
        <option>Dr. Sergio García</option>
        <option>Dr. Valencia</option>
        <option>Dr. Villanueva</option>
        <option>Dr. Cervantes</option>
        <option>Dr. Ochoa</option>
        <option>Dra. Morales</option>
        <option>Dra. Padilla</option>
        <option>Dr. Chávez</option>
        <option>Dr. Muñoz</option>
        <option>Dr. Rangel</option>
        <option>Dr. Leyva</option>
        <option>Otro</option>
      </select></div>
      <div class="col-md-6"><label for="clinica" class="form-label">Clínica</label><select id="clinica" class="form-select" required>
        <option value="">Selección</option>
        <option>Angeles</option>
        <option>FEMEDI</option>
        <option>Innova</option>
        <option>La Salud Oftalmo</option>
        <option>Latino</option>
        <option>MasFertil</option>
        <option>Memorial</option>
        <option>Nahuatzen</option>
        <option>Notre Dame</option>
        <option>Nueva España</option>
        <option>Purandiro</option>
        <option>Renacimiento</option>
        <option>Star Medica</option>
        <option>Tacambaro</option>
        <option>Valladolid</option>
        <option>Victoria</option>
        <option>Otro</option>
      </select></div>
      <div class="col-md-3"><label for="pagoRealizado" class="form-label">¿Pago Realizado?</label><select id="pagoRealizado" class="form-select" required><option value="">Selección</option><option>Pagado</option><option>Pendiente de Pago</option></select></div>
      <div class="col-md-3"><label for="formaPago" class="form-label">Forma de Pago</label><select id="formaPago" class="form-select" required><option value="">Selección</option><option>Efectivo</option><option>Transferencia</option><option>Cheque</option><option>Pendiente de Pago</option></select></div>
      <div class="col-md-4"><label for="cantidad" class="form-label">Cantidad (MXN)</label><input id="cantidad" type="number" min="0" required class="form-control"></div>
      <div class="col-md-4"><label for="fechaPago" class="form-label">Fecha de Pago</label><input id="fechaPago" type="date" class="form-control"></div>
      <div class="col-12"><label for="observaciones" class="form-label">Observaciones</label><textarea id="observaciones" rows="3" class="form-control"></textarea></div>
      <div class="col-12 text-end"><button type="submit" class="btn btn-primary">Guardar Registro</button></div>
    </form>

    <!-- Dashboard integrado al final -->
    <div id="dashboard">
      <h2 class="mt-5">Dashboard</h2>
      <div class="row mt-3">
        <div class="col-md-3">
          <h5>Filtros dinámicos</h5>
          <select id="filterEspecialidad" class="form-select mb-2"><option value="">Todas Especialidades</option></select>
          <select id="filterClinica" class="form-select mb-2"><option value="">Todas Clínicas</option></select>
          <select id="filterTipoMedico" class="form-select mb-2"><option value="">Tipo Dr./Dra.</option></select>
          <select id="filterNombreMedico" class="form-select mb-2"><option value="">Nombre Dr./Dra.</option></select>
          <button id="reloadData" class="btn btn-secondary w-100 mb-2">Mostrar Datos de Prueba</button>
        </div>
        <div class="col-md-9">
          <canvas id="chartStatus"></canvas>
          <canvas id="chartIncome" class="mt-4"></canvas>
          <table id="dataTable" class="table table-striped mt-4">
            <thead><tr><th>Fecha</th><th>Paciente</th><th>Procedimiento</th><th>Cantidad</th><th>Dr./Dra.</th></tr></thead>
            <tbody></tbody>
          </table>
          <div class="mt-3 text-end">
            <button id="exportPDF" class="btn btn-danger me-2">Exportar PDF</button>
            <button id="exportExcel" class="btn btn-success">Exportar Excel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Modo archivo vs HTTP
      const alertDiv = document.getElementById('modeAlert');
      if (location.protocol === 'file:') {
        alertDiv.innerHTML = '<div class="alert alert-warning"><strong>Atención:</strong> Abierto localmente. El dashboard usará datos de prueba.</div>';
      } else {
        alertDiv.innerHTML = '<div class="alert alert-secondary"><strong>Servidor HTTP detectado:</strong> <code>fetch</code> habilitado.</div>';
      }

      // Inicializar campos de fecha y folio
      document.getElementById('fechaRegistro').value = dayjs().format('YYYY-MM-DD');
      document.getElementById('folio').value = 'F-' + dayjs().format('YYYYMMDDHHmmss');

      // Manejo pago pendiente
      document.getElementById('pagoRealizado').addEventListener('change', e => {
        const pago = e.target.value;
        const fp = document.getElementById('formaPago');
        const cant = document.getElementById('cantidad');
        const fpago = document.getElementById('fechaPago');
        if (pago === 'Pendiente de Pago') {
          fp.value = 'Pendiente de Pago'; fp.disabled = true;
          cant.value = 0; cant.disabled = true;
          fpago.value = ''; fpago.disabled = true;
        } else {
          fp.disabled = false; cant.disabled = false; fpago.disabled = false;
        }
      });

      // Botón datos de prueba
      document.getElementById('reloadData').addEventListener('click', () => loadDashboard(sampleData));

      // Envío de formulario
      document.getElementById('patientForm').addEventListener('submit', e => {
        e.preventDefault();
        const rec = collectFormData();
        if (location.protocol === 'file:') {
          Swal.fire('Modo prueba', 'Registro guardado localmente.', 'success');
          appendLocal(rec);
        } else {
          postRecord(rec);
        }
      });

      // Carga inicial del dashboard
      if (location.protocol === 'file:') {
        loadDashboard(sampleData);
      } else {
        fetchData();
      }
    });

    const sampleData = [
      { FechaRegistro: '2025-04-20', Folio: 'F-TEST1', NombrePaciente: 'Juan Pérez', Procedimiento: 'Apendicectomía', Cantidad: '1200', NombreMedico: 'Dr. Galindo' },
      { FechaRegistro: '2025-04-20', Folio: 'F-TEST2', NombrePaciente: 'María López', Procedimiento: 'Cesárea', Cantidad: '800', NombreMedico: 'Dra. Morales' }
    ];
    let localData = [];

    function collectFormData() {
      return {
        FechaRegistro: document.getElementById('fechaRegistro').value,
        Folio: document.getElementById('folio').value,
        FechaProcedimiento: document.getElementById('fechaProcedimiento').value,
        NombrePaciente: document.getElementById('nombrePaciente').value,
        Sexo: document.getElementById('sexoPaciente').value,
        Especialidad: document.getElementById('especialidad').value,
        Procedimiento: document.getElementById('procedimientoEspecifico').value,
        TipoAnestesia: document.getElementById('tipoAnestesia').value,
        TipoMedico: document.getElementById('tipoMedico').value,
        NombreMedico: document.getElementById('nombreMedico').value,
        Clinica: document.getElementById('clinica').value,
        PagoRealizado: document.getElementById('pagoRealizado').value,
        FormaPago: document.getElementById('formaPago').value,
        Cantidad: document.getElementById('cantidad').value,
        FechaPago: document.getElementById('fechaPago').value,
        Observaciones: document.getElementById('observaciones').value
      };
    }

    function appendLocal(record) {
      localData.push(record);
      loadDashboard(sampleData.concat(localData));
    }

    function fetchData() {
      fetch('https://script.google.com/macros/s/AKfycbwEfN8mdHr3UzV5Zu8DbBdBiNBg44rFQ06qPBSBcuYrp-BjioUxXDcjQL6Z0J7KRV2N9A/exec', { mode: 'cors' })
        .then(res => { if (!res.ok) throw new Error(res.statusText); return res.json(); })
        .then(data => loadDashboard(data))
        .catch(err => { console.warn('Fetch failed:', err); loadDashboard(sampleData); });
    }

    function postRecord(rec) {
      fetch('https://script.google.com/macros/s/AKfycbwEfN8mdHr3UzV5Zu8DbBdBiNBg44rFQ06qPBSBcuYrp-BjioUxXDcjQL6Z0J7KRV2N9A/exec', {
        method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec)
      })
      .then(res => res.text())
      .then(() => { Swal.fire('¡Registro guardado!', '', 'success'); fetchData(); })
      .catch(err => { console.error('POST failed:', err); Swal.fire('Error al guardar', 'Intenta nuevamente.', 'error'); });
    }

    function loadDashboard(data) {
      const combined = Array.isArray(data) ? data : sampleData;
      const rows = combined.concat(localData);
      renderDashboard(rows);
    }

    function renderDashboard(data) {
      // Poblar tabla
      const tbody = document.querySelector('#dataTable tbody'); tbody.innerHTML = '';
      data.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${d.FechaRegistro}</td><td>${d.NombrePaciente}</td><td>${d.Procedimiento}</td><td>${d.Cantidad}</td><td>${d.NombreMedico}</td>`;
        tbody.appendChild(tr);
      });
      // Gráficos
      new Chart(document.getElementById('chartStatus').getContext('2d'), {
        type: 'bar', data: { labels: data.map(x => x.Folio), datasets: [{ label:'Pagos', data: data.map(x => +x.Cantidad) }] }
      });
      new Chart(document.getElementById('chartIncome').getContext('2d'), {
        type: 'line', data: { labels: data.map(x => x.Folio), datasets: [{ label:'Ingresos', data: data.map(x => +x.Cantidad), fill:false }] }
      });
    }
  </script>
</body>
</html>
