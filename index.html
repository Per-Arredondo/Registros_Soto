<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Pacientes - Dra. Karla Soto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #f7fafd; color: #333; font-family: 'Segoe UI', sans-serif; }
    .card { margin-bottom: 1.5rem; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    .card-header { background-color: #1976d2; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
    .form-select option[disabled][selected] { color: #999; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="card">
    <div class="card-header text-center">
      <h4>Formulario de Registro de Pacientes - Dra. Karla Soto</h4>
    </div>
    <div class="card-body">
      <form id="patientForm">
        <div class="row g-3">
          <div class="col-md-3">
            <label>Fecha</label>
            <input type="text" id="fecha" class="form-control" readonly>
          </div>
          <div class="col-md-3">
            <label>Folio</label>
            <input type="text" id="folio" class="form-control" readonly>
          </div>
          <div class="col-md-6">
            <label>Fecha del Procedimiento</label>
            <input type="date" id="fechaProcedimiento" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label>Nombre del Paciente</label>
            <input type="text" id="nombrePaciente" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label>Sexo del Paciente</label>
            <select id="sexoPaciente" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Mujer</option>
              <option>Hombre</option>
            </select>
          </div>
          <div class="col-md-6">
            <label>Procedimiento</label>
            <select id="procedimiento" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Apendicectomía</option>
              <option>Blefaroplastia</option>
              <option>Cerclaje Cervical</option>
              <option>Colonoscopia</option>
              <option>Hernioplastia</option>
              <option>Histeroscopia</option>
              <option>Infiltración Articular</option>
              <option>Litotripsia</option>
              <option>Luxación de Codo</option>
              <option>Reconstrucción</option>
              <option>Retiro Catéter Doble J</option>
              <option>RTUP</option>
              <option>Otro</option>
            </select>
            <input type="text" id="otroProcedimiento" class="form-control mt-2 hidden" placeholder="Especifique procedimiento">
          </div>
          <div class="col-md-6">
            <label>Tipo de Sedación</label>
            <select id="tipoSedacion" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Bloqueo</option>
              <option>General</option>
              <option>Sedación</option>
              <option>Otro</option>
            </select>
            <input type="text" id="otroTipoSedacion" class="form-control mt-2 hidden" placeholder="Especifique tipo de sedación">
          </div>
          <div class="col-md-6">
            <label>Anestesiólogo</label>
            <select id="anestesiologo" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Dr. Chávez</option>
              <option>Dr. Muñóz</option>
              <option>Dr. Leyva</option>
              <option>Dr. Rangel</option>
              <option>Otro</option>
            </select>
            <input type="text" id="otroAnestesio" class="form-control mt-2 hidden" placeholder="Especifique anestesiólogo">
          </div>
          <div class="col-md-6">
            <label>Clínica</label>
            <select id="clinica" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Memorial</option>
              <option>Victoria</option>
              <option>Notre Dame</option>
              <option>Star Médica</option>
              <option>Otro</option>
            </select>
            <input type="text" id="otraClinica" class="form-control mt-2 hidden" placeholder="Especifique clínica">
          </div>
          <div class="col-md-6">
            <label>Quirúrgico</label>
            <select id="cirujano" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Dr. Galindo</option>
              <option>Dr. García</option>
              <option>Dr. Ochoa</option>
              <option>Dr. Sánchez</option>
              <option>Dr. Valencia</option>
              <option>Dr. Villanueva</option>
              <option>Dr. Sergio García</option>
              <option>Dra. Morales</option>
              <option>Otro</option>
            </select>
            <input type="text" id="otroCirujano" class="form-control mt-2 hidden" placeholder="Especifique quirúrgico">
          </div>
          <div class="col-md-6">
            <label>¿Pago Realizado?</label>
            <select id="pagoRealizado" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Pagado</option>
              <option>Pendiente de Pago</option>
            </select>
          </div>
          <div class="col-md-6">
            <label>Forma de Pago</label>
            <select id="formaPago" class="form-select" required>
              <option selected disabled value="">Seleccione</option>
              <option>Efectivo</option>
              <option>Transferencia</option>
              <option>Cheque</option>
              <option>Pendiente de Pago</option>
            </select>
          </div>
          <div class="col-md-6">
            <label>Cantidad (MXN)</label>
            <input type="number" id="cantidad" class="form-control" placeholder="$0.00" required>
          </div>
          <div class="col-md-6">
            <label>Fecha de Pago</label>
            <input type="date" id="fechaPago" class="form-control">
          </div>
          <div class="col-12">
            <label>Observaciones</label>
            <textarea id="observaciones" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-success px-4">
            <i class="fas fa-save me-2"></i>Registrar Paciente
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- Aquí va el dashboard (gráficos + tabla) -->
  <!-- Y debajo, el script JavaScript actualizado -->
</div>

<!-- Dashboard -->
<div class="card">
  <div class="card-header text-center">
    <h5>Dashboard de Seguimiento</h5>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="filtroAnestesiologo">Filtrar por Anestesiólogo</label>
        <select id="filtroAnestesiologo" class="form-select">
          <option value="Todos">Todos</option>
          <option>Dr. Chávez</option>
          <option>Dr. Muñóz</option>
          <option>Dr. Leyva</option>
          <option>Dr. Rangel</option>
        </select>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button id="btnExportarPDF" class="btn btn-danger ms-auto">
          <i class="fas fa-file-pdf me-2"></i> Exportar PDF
        </button>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <canvas id="graficoEstadoPago"></canvas>
      </div>
      <div class="col-md-6">
        <canvas id="graficoIngresos"></canvas>
      </div>
    </div>
    <div class="table-responsive mt-4">
      <table class="table table-bordered table-striped">
        <thead class="table-light">
          <tr>
            <th>Fecha</th>
            <th>Paciente</th>
            <th>Procedimiento</th>
            <th>Monto</th>
            <th>Anestesiólogo</th>
          </tr>
        </thead>
        <tbody id="tablaDashboard"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Librerías necesarias -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</script>
</body>
</html>
